<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páginas Bronceadas - Directorio Interactivo 10 Piezas</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4ebd0;
            color: #2c1810;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fdfbf7;
            border: 4px solid #5c3a21;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(92, 58, 33, 0.3);
        }
        h2 {
            text-align: center;
            text-transform: uppercase;
            border-bottom: 2px dashed #5c3a21;
            padding-bottom: 15px;
            color: #2c1810;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: #5c3a21;
        }
        /* Grilla para las 10 piezas */
        .grid-10 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .slot {
            border: 2px solid #5c3a21;
            background: #f4ebd0;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .slot-title {
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .upload-box {
            width: 100%;
            height: 90px;
            background: #e3d2b0;
            border: 1px dashed #5c3a21;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }
        .upload-box input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .slot input[type="text"] {
            width: 100%;
            padding: 4px;
            font-size: 0.7rem;
            background: #fdfbf7;
            border: 1px solid #5c3a21;
            margin-bottom: 4px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        .global-controls {
            border-top: 2px dashed #5c3a21;
            padding-top: 20px;
            text-align: center;
        }
        .btn-accion {
            background: #5c3a21;
            color: #f4ebd0;
            border: 2px solid #2c1810;
            padding: 15px 30px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn-accion:hover {
            background: #7c4e31;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Páginas Bronceadas — Directorio de Colección 2026</h2>
        <div class="subtitle">Seleccione sus 10 piezas de a una, complete sus mensajes y líneas de tiempo para compilar su lámina.</div>
        
        <!-- Grilla de 10 casilleros interactivos -->
        <div class="grid-10" id="grilla-piezas">
            <!-- Se generarán dinámicamente con JS o se listan -->
        </div>

        <div class="global-controls">
            <button class="btn-accion" onclick="compilarLaminaInteractiva()">⚙️ Compilar y Descargar Lámina Final (.PNG) ⚙️</button>
        </div>
    </div>

    <script>
        // Generar los 10 slots automáticamente al cargar la página
        const grilla = document.getElementById('grilla-piezas');
        for (let i = 1; i <= 10; i++) {
            grilla.innerHTML += `
                <div class="slot">
                    <div class="slot-title">Pieza 0${i}</div>
                    <div class="upload-box" id="box-${i}">
                        <span>+ Cargar Estampilla</span>
                        <input type="file" accept="image/*" onchange="mostrarPreview(event, ${i})">
                    </div>
                    <input type="text" placeholder="Título / Ref" id="titulo-${i}">
                    <input type="text" placeholder="Geo / Ubicación" id="geo-${i}" value="MAR DEL PLATA">
                    <input type="text" placeholder="Mensaje personal" id="msg-${i}">
                </div>
            `;
        }

        function mostrarPreview(event, id) {
            const box = document.getElementById(`box-${id}`);
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    box.style.backgroundImage = `url(${e.target.result})`;
                    box.style.backgroundSize = 'cover';
                    box.style.backgroundPosition = 'center';
                    box.querySelector('span').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function compilarLaminaInteractiva() {
            alert("¡Orden procesada! Empaquetando las 10 piezas interactivas del estudio para generar su lámina de culto...");
        }
    </script>
</body>
</html>
