<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Ahorros BonusCom - Páginas Bronceadas</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4ebd0;
            color: #2c1810;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fdfbf7;
            border: 4px solid #5c3a21;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(92, 58, 33, 0.3);
        }
        h2 {
            text-align: center;
            text-transform: uppercase;
            border-bottom: 2px dashed #5c3a21;
            padding-bottom: 10px;
            color: #2c1810;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #f4ebd0;
            border: 1px solid #5c3a21;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        .btn-compilar {
            background: #5c3a21;
            color: #f4ebd0;
            border: 2px solid #2c1810;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 4px;
        }
        .btn-compilar:hover {
            background: #7c4e31;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Páginas Bronceadas — Directorio de Colección</h2>
        <p style="text-align: center; font-size: 0.85rem;">Caja de Ahorros BonusCom: Inyecte sus datos para compilar su lámina de 10 piezas históricas.</p>
        
        <div class="form-group">
            <label>Mensaje Personal / Esencia:</label>
            <input type="text" id="user-msg" value="Captura de esencia...">
        </div>
        
        <div class="form-group">
            <label>Geolocalización:</label>
            <input type="text" id="user-geo" value="MAR DEL PLATA">
        </div>

        <div class="form-group">
            <label>ID de Lote (Automático):</label>
            <input type="text" id="user-id" value="2026-X100" readonly>
        </div>

        <button class="btn-compilar" onclick="generarHoja()">⚙️ Compilar Lámina de Colección (.PNG) ⚙️</button>
    </div>

    <script>
        function generarHoja() {
            const mensaje = document.getElementById('user-msg').value;
            const geo = document.getElementById('user-geo').value;
            alert("¡Orden recibida! Preparando lote de 10 piezas desde " + geo + " con el mensaje: '" + mensaje + "'...");
        }
    </script>
</body>
</html>
