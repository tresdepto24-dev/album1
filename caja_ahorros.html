<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Páginas Bronceadas - BonusCom</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #f4ebd0; color: #2c1810; padding: 20px; }
        .editor-container { max-width: 800px; margin: 0 auto; background: #fdfbf7; padding: 30px; border: 4px solid #5c3a21; }
        .preview-area { width: 100%; height: 500px; background: #e3d2b0; border: 2px dashed #5c3a21; margin-top: 20px; display: flex; align-items: center; justify-content: center; color: #5c3a21; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #5c3a21; background: #f4ebd0; }
        button { background: #5c3a21; color: #f4ebd0; padding: 15px; width: 100%; cursor: pointer; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>PÁGINAS BRONCEADAS — DIRECTORIO DE COLECCIÓN</h2>
        <input type="text" id="mensaje" placeholder="Mensaje para su lámina...">
        <input type="text" id="geo" placeholder="Geolocalización (ej: MAR DEL PLATA)">
        <button onclick="visualizar()">⚙️ PREVISUALIZAR LÁMINA</button>

        <div class="preview-area" id="preview">
            [Área de Visualización de la Lámina en Tiempo Real]
        </div>
        
        <button style="margin-top:10px; background:#2c1810;" onclick="alert('Descargando su lámina histórica...')">💾 DESCARGAR LÁMINA FINAL (.PNG)</button>
    </div>
</body>
</html>
