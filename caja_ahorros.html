<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álbum Interactivo BonusCom - Vía del Milisegundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: 'Share Tech Mono', monospace; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #222; padding: 30px; border: 2px solid #00f2ff; border-radius: 10px; }
        .btn-accion { background: #00f2ff; color: #000; font-family: 'Orbitron', sans-serif; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; font-size: 1.2rem; }
        #canvas-output { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Álbum Interactivo BonusCom</h2>
        <input type="file" id="input-imagen" accept="image/*" onchange="cargarImagen(event)">
        <p>El ID Robusto se generará automáticamente con el sello de la Vía del Milisegundo.</p>
        <button class="btn-accion" onclick="estamparPieza()">GENERAR ESTAMPA MILISEGUNDO HD</button>
    </div>

    <canvas id="canvas-output" width="800" height="600"></canvas>

    <script>
        let imagenSeleccionada = null;

        function cargarImagen(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = () => { imagenSeleccionada = img; };
                img.src = e.target.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function estamparPieza() {
            const canvas = document.getElementById('canvas-output');
            const ctx = canvas.getContext('2d');
            const ahora = new Date();
            const timestamp = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString() + ':' + ahora.getMilliseconds();
            const idRobusto = "REF-" + ahora.getTime().toString().slice(-8) + "-BC-MILLI";

            // Fondo y dibujo base
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 800, 600);
            if(imagenSeleccionada) ctx.drawImage(imagenSeleccionada, 0, 0, 800, 600);

            // Capa de Efecto Neón (Celeste Brillante)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f2ff";
            ctx.fillStyle = "#00f2ff";

            // Línea de Tiempo (Producto Estrella)
            ctx.font = 'bold 40px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("VÍA DEL MILISEGUNDO", 400, 80);
            ctx.font = '24px "Share Tech Mono", monospace';
            ctx.fillText(timestamp, 400, 120);

            // ID Robusto (El respaldo que no se negocia)
            ctx.font = '18px "Share Tech Mono", monospace';
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#fff";
            ctx.fillText("ID REGISTRO: " + idRobusto, 400, 560);
            
            ctx.strokeStyle = "#00f2ff";
            ctx.strokeRect(20, 20, 760, 560);

            // Descarga
            const link = document.createElement('a');
            link.download = 'Estampa_Milisegundo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
