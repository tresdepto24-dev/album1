<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páginas Bronceadas - Pieza Individual de Colección</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #f4ebd0;
            color: #2c1810;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fdfbf7;
            border: 4px solid #5c3a21;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(92, 58, 33, 0.3);
            display: flex;
            gap: 30px;
        }
        .form-section {
            flex: 1;
        }
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            font-family: 'Special Elite', cursive;
            font-size: 1.4rem;
            text-transform: uppercase;
            border-bottom: 2px dashed #5c3a21;
            padding-bottom: 10px;
            color: #2c1810;
            margin-top: 0;
        }
        label {
            font-size: 0.8rem;
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #5c3a21;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            font-size: 0.85rem;
            background: #f4ebd0;
            border: 1px solid #5c3a21;
            margin-top: 5px;
            box-sizing: border-box;
            font-family: 'Courier Prime', monospace;
        }
        .card-preview {
            width: 320px;
            height: 420px;
            background: #f4ebd0;
            border: 3px solid #5c3a21;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .card-title {
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            text-align: center;
            border-bottom: 1px solid #5c3a21;
            padding-bottom: 5px;
        }
        .card-img-box {
            width: 100%;
            height: 180px;
            background: #e3d2b0;
            border: 1px dashed #5c3a21;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .card-data {
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .btn-accion {
            font-family: 'Special Elite', cursive;
            background: #5c3a21;
            color: #f4ebd0;
            border: 2px solid #2c1810;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 4px;
        }
        .btn-accion:hover {
            background: #7c4e31;
        }
        #canvas-output {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel de Controles -->
        <div class="form-section">
            <h2>Generador de Aviso Individual</h2>
            
            <label>Imagen del Comercio / Estampilla:</label>
            <input type="file" accept="image/*" id="input-imagen" onchange="actualizarImagen(event)">

            <label>Título del Coleccionable:</label>
            <input type="text" id="input-titulo" value="Aviso Destacado - Comercio" oninput="actualizarTexto()">

            <label>Lugar de Referencia (GEO):</label>
            <input type="text" id="input-geo" value="MAR DEL PLATA" oninput="actualizarTexto()">

            <label>Línea de Tiempo / Fecha:</label>
            <input type="text" id="input-fecha" value="Adquisición BonusCom 2026" oninput="actualizarTexto()">

            <label>Mensaje Personal / Anotación:</label>
            <input type="text" id="input-msg" value="Esencia capturada en el puerto" oninput="actualizarTexto()">

            <button class="btn-accion" onclick="descargarPiezaHD()">💾 Descargar Pieza HD (.PNG)</button>
        </div>

        <!-- Vista Previa en Vivo -->
        <div class="preview-section">
            <div style="font-family: 'Special Elite'; font-size: 0.8rem; margin-bottom: 8px;">VISTA PREVIA EN VIVO</div>
            <div class="card-preview" id="preview-box">
                <div class="card-title" id="prev-titulo">Aviso Destacado - Comercio</div>
                <div class="card-img-box" id="prev-img-box">[ Sin Imagen de Comercio ]</div>
                <div class="card-data">
                    <div><strong>ID:</strong> 2026-X01</div>
                    <div id="prev-geo"><strong>GEO:</strong> MAR DEL PLATA</div>
                    <div id="prev-fecha"><strong>REF:</strong> Adquisición BonusCom 2026</div>
                    <div id="prev-msg" style="margin-top:5px; font-style:italic;"><strong>MSG:</strong> Esencia capturada en el puerto</div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas-output" width="800" height="1050"></canvas>

    <script>
        let imagenSeleccionada = null;

        function actualizarImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        imagenSeleccionada = img;
                        document.getElementById('prev-img-box').style.backgroundImage = `url(${e.target.result})`;
                        document.getElementById('prev-img-box').innerText = '';
                    };
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function actualizarTexto() {
            document.getElementById('prev-titulo').innerText = document.getElementById('input-titulo').value;
            document.getElementById('prev-geo').innerHTML = `<strong>GEO:</strong> ${document.getElementById('input-geo').value}`;
            document.getElementById('prev-fecha').innerHTML = `<strong>REF:</strong> ${document.getElementById('input-fecha').value}`;
            document.getElementById('prev-msg').innerHTML = `<strong>MSG:</strong> ${document.getElementById('input-msg').value}`;
        }

        function descargarPiezaHD() {
            const canvas = document.getElementById('canvas-output');
            const ctx = canvas.getContext('2d');

            // Fondo de la tarjeta individual
            ctx.fillStyle = '#f4ebd0';
            ctx.fillRect(0, 0, 800, 1050);

            // Marco exterior elegante
            ctx.strokeStyle = '#5c3a21';
            ctx.lineWidth = 8;
            ctx.strokeRect(40, 40, 720, 970);

            // Título principal de la pieza
            ctx.fillStyle = '#2c1810';
            ctx.font = 'bold 32px "Special Elite", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('input-titulo').value, 400, 110);

            // Recuadro de la imagen en alta definición
            ctx.fillStyle = '#e3d2b0';
            ctx.fillRect(100, 150, 600, 450);
            ctx.lineWidth = 4;
            ctx.strokeRect(100, 150, 600, 450);

            if (imagenSeleccionada) {
                ctx.drawImage(imagenSeleccionada, 100, 150, 600, 450);
            } else {
                ctx.fillStyle = '#5c3a21';
                ctx.font = '20px "Courier Prime", monospace';
                ctx.fillText('[ Imagen de Comercio no cargada ]', 400, 385);
            }

            // Datos de archivo y anotaciones en alta calidad
            ctx.textAlign = 'left';
            ctx.font = 'bold 22px "Courier Prime", monospace';
            let startY = 660;

            ctx.fillText("ID DE REGISTRO: 2026-X01-BONUSCOM", 100, startY);
            ctx.fillText("LUGAR DE REFERENCIA: " + document.getElementById('input-geo').value, 100, startY + 45);
            ctx.fillText("FECHA / ADQUISICIÓN: " + document.getElementById('input-fecha').value, 100, startY + 90);
            
            ctx.font = 'italic 24px "Courier Prime", monospace';
            ctx.fillStyle = '#0f172a';
            ctx.fillText("ANOTACIÓN: " + document.getElementById('input-msg').value, 100, startY + 150);

            // Sello de pie de página institucional
            ctx.fillStyle = '#5c3a21';
            ctx.font = '18px "Special Elite", monospace';
            ctx.textAlign = 'center';
            ctx.fillText("© 2026 VentaniYA! Cinemascopado — Hoja de Estampado Histórico", 400, 960);

            // Disparar descarga en HD
            const enlace = document.createElement('a');
            enlace.download = 'pieza_coleccion_hd.png';
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        }
    </script>
</body>
</html>
